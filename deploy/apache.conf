# Vhost de Apache de Fuji Recipes, para un servidor que ya sirve otras webs con
# Apache (provision.sh lo copia a sites-available; certbot --apache crea después
# la versión -le-ssl y la redirección desde http). PHP va al pool propio de la
# app, sin tocar el PHP del resto de sitios.
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot __APP_DIR__/web/public

    <Directory __APP_DIR__/web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/__APP_USER__.sock|fcgi://localhost"
    </FilesMatch>

    # El OCR de capturas tarda unos segundos
    ProxyTimeout 120

    <IfModule mod_headers.c>
        Header always set X-Robots-Tag "noindex, nofollow"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/fuji-recipes-error.log
    CustomLog ${APACHE_LOG_DIR}/fuji-recipes-access.log combined
</VirtualHost>
