; Pool de PHP-FPM de Fuji Recipes (provision.sh lo copia a
; /etc/php/8.4/fpm/pool.d/). Corre como el usuario de la app, así que la web,
; make y los scripts de Python escriben en los mismos ficheros sin líos de permisos.
[__APP_USER__]
user = __APP_USER__
group = __APP_USER__
listen = /run/php/__APP_USER__.sock
listen.owner = www-data
listen.group = www-data

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s

; El OCR de capturas llama a .venv/bin/python, que llama a tesseract
env[PATH] = /usr/local/bin:/usr/bin:/bin

; Fotos de hasta 64 MB, como make serve; el OCR tarda unos segundos
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120
php_admin_value[memory_limit] = 256M
